app:
  description: '淘宝商品与竞品监控 —— 把采集器产出的变化事件，转成可执行的运营建议与告警分流。

    链路：开始 → 输入归一化(Code) → LLM 分析 → 结果解析(Code) → 条件分支 → 结束。

    设计要点：确定性判断（字段兜底、是否推送）全放 Code 节点，LLM 只做归因、动作细化、优先级复核。'
  icon: 🛒
  icon_background: '#FFEAD5'
  mode: workflow
  name: 淘宝商品竞品监控-运营建议
  use_icon_as_answer_icon: false
